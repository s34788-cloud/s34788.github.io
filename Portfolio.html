<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แฟ้มสะสมผลงาน | PORTFOLIO</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Kanit', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: linear-gradient(-45deg, #0d0e12, #1f0808, #2b0b0e, #0f1115);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.menu-container {
    width: 100%;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.menu-card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    text-decoration: none;
    color: #333;
    border: 2px solid #FF2A2A;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.menu-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(255, 42, 42, 0.3);
}

.icon-wrapper {
    width: 70px;
    height: 70px;
    background: #FFEAEA;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    border: 1px dashed #FF2A2A;
}

.icon-wrapper i {
    font-size: 30px;
    color: #D32F2F;
}

.card-title {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin-bottom: 8px;
}

.card-desc {
    font-size: 14px;
    color: #666;
    margin-bottom: 15px;
}

.card-link {
    font-size: 14px;
    font-weight: 600;
    color: #D32F2F;
    display: flex;
    align-items: center;
    gap: 5px;
}

.btn-back-home {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    text-decoration: none;
    border-radius: 30px;
    font-size: 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    align-self: center;
    transition: all 0.3s ease;
}

.btn-back-home:hover {
    background: #D32F2F;
}
</style>
</head>

<body>

<div class="menu-container">

    <!-- กรอบที่ 1: แนะนำตนเอง -->
    <a href="about.html" class="menu-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-user-gear"></i>
        </div>
        <h2 class="card-title">แนะนำตนเอง</h2>
        <p class="card-desc">ประวัติส่วนตัว ทักษะความสามารถ ความสนใจ และเป้าหมายทางการศึกษา</p>
        <div class="card-link">เข้าสู่หน้านี้ <i class="fa-solid fa-arrow-right"></i></div>
    </a>

    <!-- กรอบที่ 2: แฟ้มสะสมผลงาน -->
    <a href="projects.html" class="menu-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-folder-open"></i>
        </div>
        <h2 class="card-title">แฟ้มสะสมผลงาน</h2>
        <p class="card-desc">รวบรวมผลงาน โครงงาน กิจกรรม และเกียรติบัตรที่เคยได้รับ</p>
        <div class="card-link">เข้าสู่หน้านี้ <i class="fa-solid fa-arrow-right"></i></div>
    </a>

    <!-- กรอบที่ 3: รูปการทำงาน (เพิ่มใหม่) -->
    <a href="activities.html" class="menu-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-briefcase"></i>
        </div>
        <h2 class="card-title">รูปการทำงานและกิจกรรม</h2>
        <p class="card-desc">ประมวลภาพบรรยากาศการทำงาน การลงมือปฏิบัติจริง และการทำกิจกรรมต่างๆ</p>
        <div class="card-link">เข้าสู่หน้านี้ <i class="fa-solid fa-arrow-right"></i></div>
    </a>

    <!-- ปุ่มกลับหน้าแรก -->
    <a href="index.html" class="btn-back-home">
        <i class="fa-solid fa-house"></i> กลับหน้าแรก
    </a>

</div>

</body>
</html>
