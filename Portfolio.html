<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เมนูหลัก | PORTFOLIO - ฐาปนา เดชชีวะ</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Kanit', sans-serif;
}

:root {
    --primary-red: #D32F2F;
    --bright-red: #FF2A2A;
    --accent-orange: #FF5722;
    --tech-dark: #0F1115;
    --card-bg: rgba(255, 255, 255, 0.96);
    --white: #FFFFFF;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    position: relative;
    overflow-x: hidden;

    /* Animated Gradient Background */
    background: linear-gradient(-45deg, #0d0e12, #1f0808, #2b0b0e, #0f1115);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Background Grid Overlay */
body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(rgba(211, 47, 47, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(211, 47, 47, 0.1) 1px, transparent 1px);
    background-size: 35px 35px;
    z-index: 0;
    pointer-events: none;
}

.main-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 950px;
}

/* Grid Layout: Split Left and Right */
.menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin-bottom: 35px;
}

/* Interactive Card Style */
.menu-card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    text-decoration: none;
    color: #222;
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(211, 47, 47, 0.3);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.menu-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, var(--primary-red), var(--accent-orange));
    transition: height 0.3s ease;
}

.menu-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(211, 47, 47, 0.3);
    border-color: var(--bright-red);
}

.menu-card:hover::before {
    height: 10px;
}

.icon-box {
    width: 90px;
    height: 90px;
    background: rgba(211, 47, 47, 0.08);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    font-size: 38px;
    color: var(--primary-red);
    border: 2px dashed rgba(211, 47, 47, 0.4);
    transition: all 0.3s ease;
}

.menu-card:hover .icon-box {
    background: var(--primary-red);
    color: var(--white);
    transform: scale(1.1) rotate(5deg);
}

.card-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #111;
}

.card-desc {
    font-size: 14px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 20px;
}

.card-arrow {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-red);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: gap 0.3s ease;
}

.menu-card:hover .card-arrow {
    gap: 14px;
    color: var(--bright-red);
}

/* Home Navigation Button */
.btn-back-container {
    text-align: center;
}

.btn-back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--white);
    text-decoration: none;
    border-radius: 50px;
    font-weight: 500;
    font-size: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
    transition: all 0.3s ease;
}

.btn-back:hover {
    background: var(--primary-red);
    border-color: var(--primary-red);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
}

/* Responsive view for Mobile */
@media (max-width: 768px) {
    .menu-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="main-container">

    <div class="menu-grid">
        
        <!-- กรอบที่ 1: แนะนำตนเอง -->
        <a href="about.html" class="menu-card">
            <div class="icon-box">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <h2 class="card-title">แนะนำตนเอง</h2>
            <p class="card-desc">ประวัติส่วนตัว ทักษะความสามารถ ความสนใจ และเป้าหมายทางการศึกษา</p>
            <div class="card-arrow">
                <span>เข้าสู่หน้านี้</span>
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- กรอบที่ 2: แฟ้มสะสมผลงาน -->
        <a href="projects.html" class="menu-card">
            <div class="icon-box">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h2 class="card-title">แฟ้มสะสมผลงาน</h2>
            <p class="card-desc">รวบรวมผลงาน โครงงาน กิจกรรม และเกียรติบัตรที่เคยได้รับ</p>
            <div class="card-arrow">
                <span>เข้าสู่หน้านี้</span>
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

    </div>

    <!-- ปุ่มกลับหน้าแรก -->
    <div class="btn-back-container">
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-house"></i>
            <span>กลับหน้าแรก</span>
        </a>
    </div>

</div>

</body>
</html>
